<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
	<defs>
		<linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
			<stop offset="0%" stop-color="#0a0f1d" />
			<stop offset="50%" stop-color="#0f172a" />
			<stop offset="100%" stop-color="#020617" />
		</linearGradient>

		<linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
			<stop offset="0%" stop-color="#38bdf8" />
			<stop offset="50%" stop-color="#6366f1" />
			<stop offset="100%" stop-color="#10b981" />
		</linearGradient>

		<linearGradient id="knightLight" x1="0%" y1="0%" x2="100%" y2="100%">
			<stop offset="0%" stop-color="#38bdf8" />
			<stop offset="100%" stop-color="#0284c7" />
		</linearGradient>

		<linearGradient id="knightDark" x1="0%" y1="0%" x2="100%" y2="100%">
			<stop offset="0%" stop-color="#10b981" />
			<stop offset="100%" stop-color="#059669" />
		</linearGradient>

		<linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
			<stop offset="0%" stop-color="#fde047" />
			<stop offset="100%" stop-color="#eab308" />
		</linearGradient>

		<filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
			<feGaussianBlur stdDeviation="8" result="blur" />
			<feComposite in="SourceGraphic" in2="blur" operator="over" />
		</filter>
	</defs>

	<!-- Squircle Background -->
	<rect x="20" y="20" width="472" height="472" rx="112" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="12" />

	<!-- Clock Dial Track -->
	<circle cx="256" cy="256" r="184" fill="none" stroke="#38bdf8" stroke-width="3" stroke-opacity="0.25" stroke-dasharray="6 8" />
	<circle cx="256" cy="256" r="198" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.3" />

	<!-- Clock Hour Markers -->
	<!-- 12 o'clock -->
	<rect x="252" y="78" width="8" height="24" rx="4" fill="#38bdf8" filter="url(#glow)" />
	<!-- 3 o'clock -->
	<rect x="410" y="252" width="24" height="8" rx="4" fill="#10b981" filter="url(#glow)" />
	<!-- 6 o'clock -->
	<rect x="252" y="410" width="8" height="24" rx="4" fill="#38bdf8" />
	<!-- 9 o'clock -->
	<rect x="78" y="252" width="24" height="8" rx="4" fill="#10b981" />

	<!-- Diagonal hour dots -->
	<circle cx="348" cy="98" r="5" fill="#fde047" opacity="0.8" />
	<circle cx="414" cy="164" r="5" fill="#fde047" opacity="0.8" />
	<circle cx="414" cy="348" r="5" fill="#fde047" opacity="0.8" />
	<circle cx="348" cy="414" r="5" fill="#fde047" opacity="0.8" />
	<circle cx="164" cy="414" r="5" fill="#fde047" opacity="0.8" />
	<circle cx="98" cy="348" r="5" fill="#fde047" opacity="0.8" />
	<circle cx="98" cy="164" r="5" fill="#fde047" opacity="0.8" />
	<circle cx="164" cy="98" r="5" fill="#fde047" opacity="0.8" />

	<!-- Subtle Clock Hands behind Knight -->
	<line x1="256" y1="256" x2="330" y2="160" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round" filter="url(#glow)" opacity="0.85" />
	<line x1="256" y1="256" x2="170" y2="185" stroke="#38bdf8" stroke-width="10" stroke-linecap="round" opacity="0.75" />

	<!-- Sculpted Staunton Chess Knight Silhouette -->
	<!-- Pedestal Base -->
	<path d="M 160 400 L 352 400 C 352 386 340 376 325 373 L 187 373 C 172 376 160 386 160 400 Z" fill="url(#knightLight)" />
	<rect x="180" y="362" width="152" height="11" rx="5" fill="url(#knightDark)" />

	<!-- Left Facet (Chest & Muzzle) -->
	<path d="
		M 256 124
		L 242 165
		C 230 175 198 200 178 228
		C 152 264 150 300 174 340
		C 182 353 194 362 208 362
		L 256 362
		L 256 260
		C 256 226 230 226 220 236
		C 214 242 206 238 206 230
		C 206 218 226 195 244 186
		C 248 184 252 184 256 186
		Z
	" fill="url(#knightLight)" />

	<!-- Right Facet (Arched Neck & Mane) -->
	<path d="
		M 256 124
		L 270 120
		C 276 118 284 122 284 130
		L 278 152
		C 292 155 316 172 328 196
		C 342 225 344 265 340 305
		C 337 334 322 355 304 362
		L 256 362
		L 256 186
		Z
	" fill="url(#knightDark)" />

	<!-- Mane Crest Notches -->
	<path d="M 282 150 L 302 142 L 292 166 Z" fill="#38bdf8" />
	<path d="M 314 184 L 336 180 L 322 204 Z" fill="#38bdf8" />
	<path d="M 334 228 L 354 230 L 338 252 Z" fill="#38bdf8" />

	<!-- Knight Eye (Glowing Hex/Diamond) -->
	<polygon points="228,188 238,182 244,192 234,198" fill="#ffffff" filter="url(#glow)" />
	<circle cx="236" cy="190" r="2.5" fill="#0f172a" />

	<!-- Center Clock Hub & Glowing Rivet -->
	<circle cx="256" cy="256" r="14" fill="#0f172a" stroke="#38bdf8" stroke-width="4" filter="url(#glow)" />
	<circle cx="256" cy="256" r="5" fill="#fde047" />
</svg>
